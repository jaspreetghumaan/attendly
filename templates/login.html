<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendly - Student Login</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Remix Icons / Lucide alternative via SVG or CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <div class="card-container">
    <!-- Left Section: Illustration & Taglines -->
    <div class="left-panel">
      <div class="illustration-wrapper">
        <!-- Replace this SVG / image with your custom attendance illustration -->
        <svg viewBox="0 0 420 300" width="100%" height="auto" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Background Dashboard Mockup -->
          <rect x="70" y="20" width="310" height="190" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
          <circle cx="88" cy="35" r="4" fill="#22C55E"/>
          <rect x="98" y="32" width="70" height="6" rx="3" fill="#64748B"/>
          <!-- Metric circles -->
          <circle cx="250" cy="55" r="16" stroke="#93C5FD" stroke-width="2"/>
          <text x="250" y="58" font-size="10" text-anchor="middle" fill="#1E293B" font-family="Inter" font-weight="bold">60</text>
          <circle cx="295" cy="55" r="16" stroke="#93C5FD" stroke-width="2"/>
          <text x="295" y="58" font-size="10" text-anchor="middle" fill="#1E293B" font-family="Inter" font-weight="bold">48</text>
          <circle cx="340" cy="55" r="16" stroke="#86EFAC" stroke-width="2"/>
          <text x="340" y="58" font-size="9" text-anchor="middle" fill="#1E293B" font-family="Inter" font-weight="bold">80%</text>

          <!-- QR Card Placeholder -->
          <rect x="85" y="50" width="85" height="135" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
          
          <!-- Data Rows -->
          <rect x="185" y="105" width="180" height="14" rx="4" fill="#F8FAFC"/>
          <circle cx="192" cy="112" r="3" fill="#93C5FD"/>
          <rect x="200" y="110" width="40" height="4" rx="2" fill="#94A3B8"/>
          <rect x="330" y="107" width="30" height="10" rx="4" fill="#DCFCE7"/>

          <rect x="185" y="125" width="180" height="14" rx="4" fill="#F8FAFC"/>
          <circle cx="192" cy="132" r="3" fill="#93C5FD"/>
          <rect x="200" y="130" width="50" height="4" rx="2" fill="#94A3B8"/>
          <rect x="330" y="127" width="30" height="10" rx="4" fill="#DCFCE7"/>

          <rect x="185" y="145" width="180" height="14" rx="4" fill="#F8FAFC"/>
          <circle cx="192" cy="152" r="3" fill="#93C5FD"/>
          <rect x="200" y="150" width="35" height="4" rx="2" fill="#94A3B8"/>
          <rect x="330" y="147" width="30" height="10" rx="4" fill="#DCFCE7"/>

          <rect x="185" y="165" width="180" height="14" rx="4" fill="#F8FAFC"/>
          <circle cx="192" cy="172" r="3" fill="#93C5FD"/>
          <rect x="200" y="170" width="45" height="4" rx="2" fill="#94A3B8"/>
          <rect x="330" y="167" width="30" height="10" rx="4" fill="#FEF3C7"/>

          <!-- Character & Chair -->
          <polygon points="40,240 70,180 130,225 105,240" fill="#2563EB"/>
          <polygon points="70,180 120,180 145,230 130,225" fill="#3B82F6"/>
          <!-- Person -->
          <circle cx="120" cy="135" r="14" fill="#1E293B"/>
          <path d="M110,150 C110,140 135,140 135,150 L145,190 L105,190 Z" fill="#2563EB"/>
          <rect x="105" y="185" width="45" height="40" rx="6" fill="#1E3A8A"/>
          <rect x="135" y="165" width="28" height="38" rx="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
          <line x1="30" y1="240" x2="390" y2="240" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="badge-pill">SIMPLE • SMART • SECURE</div>
      <h2 class="left-heading">Smarter Classroom Check-Ins</h2>
    </div>

    <!-- Right Section: Login Form -->
    <div class="right-panel">
      <!-- Brand Logo & Name -->
      <div class="brand">
        <div class="logo-box">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 0 0-7.07 17.07l.07.07L12 22l7-2.86.07-.07A10 10 0 0 0 12 2z"></path>
            <path d="M15 9h-4.5a2 2 0 0 0 0 4h3a2 2 0 0 1 0 4H9"></path>
          </svg>
        </div>
        <span class="brand-name">Attendly</span>
      </div>

      <!-- Title & Subtitle -->
      <h1 class="form-title">Student Login</h1>
      <p class="form-subtitle">Hey, enter your details to sign in to your account</p>

      <!-- Toggle Role Switch -->
      <div class="role-selector">
        <button type="button" class="role-btn active" id="btn-student">Student</button>
        <button type="button" class="role-btn" id="btn-educator">Educator</button>
      </div>

      <!-- Inputs Form -->
      <form class="login-form">
        <div class="input-group">
          <i class="fa-regular fa-user input-icon"></i>
          <input type="text" placeholder="Enter your username/email" required />
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="submit-btn">Login In</button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span>Or Sign in with</span>
      </div>

      <!-- Social Logins -->
      <div class="social-login">
        <button type="button" class="social-btn">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.27v3.15C3.25 21.36 7.35 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.27C.46 8.2.01 10.04.01 12c0 1.96.45 3.8 1.26 5.42l4.01-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.25 2.64 1.27 6.58l4.01 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          Google
        </button>
        <button type="button" class="social-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Facebook
        </button>
      </div>

      <!-- Signup Redirect -->
      <p class="signup-text">
        Don't have an account? <a href="#">Signup Now</a>
      </p>
    </div>
  </div>

</body>
</html>
