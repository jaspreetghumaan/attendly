<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#7257e8">
    <title>Attendly | Change Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <script nonce="{{ csp_nonce }}">
        /* Dark mode: apply the saved choice before the page paints (no white flash) */
        (function () {
            try {
                if (localStorage.getItem('theme') === 'dark') {
                    document.documentElement.classList.add('dark-mode');
                }
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <main class="reset-wrap">
        <section class="reset-card">
            <a href="{{ back }}" class="back-home">&larr; Back to dashboard</a>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="flash-messages" role="alert">
                {% for m in messages %}<p>{{ m }}</p>{% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <h1 class="reset-title">Change password</h1>
            <p class="reset-text">Use at least 8 characters, with letters and numbers. You stay logged in after changing it.</p>

            <form method="POST" action="{{ url_for('change_password') }}" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="current_password">Current Password</label>
                    <input type="password" id="current_password" name="current_password" placeholder="Enter your current password"
                        autocomplete="current-password" required>
                </div>
                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" placeholder="Enter a new password"
                        autocomplete="new-password" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password"
                        placeholder="Re-enter the new password" autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit" class="login-button">
                    Change Password
                    <span aria-hidden="true">&rarr;</span>
                </button>
            </form>
        </section>
    </main>
</body>

</html>
